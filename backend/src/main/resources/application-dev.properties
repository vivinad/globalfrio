# ===================================================================
# PERFIL dev - BASE DE DATOS H2 EN MEMORIA (pruebas rápidas, sin SQL Server)
# ===================================================================
# Los datos se pierden al detener la aplicación.
spring.datasource.url=jdbc:h2:mem:globalfriodb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

# Consola interactiva H2 (solo acceso local)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false
