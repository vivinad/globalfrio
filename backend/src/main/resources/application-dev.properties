# ===================================================================
# PERFIL dev - BASE DE DATOS H2 EN MEMORIA (no requiere instalar nada)
# ===================================================================
# La base de datos vive dentro del backend: se crea al iniciar la aplicación
# con las tablas y datos de db/h2/schema.sql y db/h2/data.sql, y se borra al
# detenerla. No se conecta a ningún SQL Server.
spring.datasource.url=jdbc:h2:mem:globalfriodb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Las tablas las crean los scripts (modelo físico), no Hibernate.
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/h2/schema.sql
spring.sql.init.data-locations=classpath:db/h2/data.sql
spring.sql.init.encoding=UTF-8
spring.jpa.hibernate.ddl-auto=validate

# Consola web para ver las tablas: http://localhost:8080/h2-console
# JDBC URL: jdbc:h2:mem:globalfriodb   Usuario: sa   Contraseña: (vacía)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false
