# ===================================================================
# PERFIL sqlserver - BASE DE DATOS MICROSOFT SQL SERVER (Express)
# ===================================================================
# La base globalfrio_db y sus tablas se crean con database/BD_GLOBALFRIO.sql
# y el usuario del backend con database/USUARIO_BACKEND.sql (ambos en SSMS).
# La aplicación NO crea ni modifica tablas: solo valida que las entidades JPA
# coincidan con las tablas existentes.
#
# La contraseña NO se sube a GitHub. Se lee, en este orden, de:
#   1. el archivo backend/bd-local.properties (copia de bd-local.properties.ejemplo)
#   2. las variables de entorno DB_URL, DB_USUARIO y DB_CLAVE
spring.config.import=optional:file:./bd-local.properties

spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=globalfrio_db;encrypt=true;trustServerCertificate=true}
spring.datasource.driverClassName=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.username=${DB_USUARIO:globalfrio_backend}
spring.datasource.password=${DB_CLAVE:}
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect

# validate: si una entidad no coincide con su tabla, la aplicación no inicia y muestra
# el error indicando la tabla o columna. Así el código y el modelo físico quedan alineados.
spring.jpa.hibernate.ddl-auto=validate

# La consola H2 no aplica con SQL Server
spring.h2.console.enabled=false
