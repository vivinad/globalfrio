# ===================================================================
# PERFIL sqlserver - BASE DE DATOS MICROSOFT SQL SERVER
# ===================================================================
# La base de datos y sus tablas se crean con los scripts de backend/database
# (modelo físico). La aplicación NO crea ni modifica tablas: solo valida
# que las entidades JPA coincidan con las tablas existentes.
#
# Usuario y contraseña se leen de variables de entorno para no subirlos a GitHub:
#   DB_USUARIO (por defecto: sa)
#   DB_CLAVE   (obligatoria: la contraseña de sa en tu SQL Server)
#   DB_URL     (opcional: por defecto localhost, puerto 1433, base globalfrio_db)
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=globalfrio_db;encrypt=true;trustServerCertificate=true}
spring.datasource.driverClassName=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.username=${DB_USUARIO:sa}
spring.datasource.password=${DB_CLAVE:}
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect

# validate: si una entidad no coincide con su tabla, la aplicación no inicia y muestra
# el error indicando la tabla o columna. Así el código y el modelo físico quedan alineados.
spring.jpa.hibernate.ddl-auto=validate

# La consola H2 no aplica con SQL Server
spring.h2.console.enabled=false
