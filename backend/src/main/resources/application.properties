# ===================================================================
# CONFIGURACIÓN GENERAL DEL SERVIDOR WEB
# ===================================================================
server.port=8080
spring.application.name=globalfrio-backend

# Perfil activo:
#   dev       -> base de datos H2 en memoria dentro del backend, con tablas y datos (por defecto)
#   sqlserver -> base de datos en SQL Server (application-sqlserver.properties)
# Para usar SQL Server sin tocar este archivo:  $env:SPRING_PROFILES_ACTIVE = "sqlserver"
spring.profiles.active=dev

# ===================================================================
# JPA / HIBERNATE (común a todos los perfiles)
# ===================================================================
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===================================================================
# CONFIGURACIÓN SWAGGER / OPENAPI 3
# ===================================================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui/index.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# ===================================================================
# PARÁMETROS DE SEGURIDAD Y JWT (S05 - SIST1402A)
# ===================================================================
# Clave HMAC-SHA256 de al menos 256 bits (64 caracteres hexadecimales)
globalfrio.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
# Expiración del token: 86400000 ms (24 horas)
globalfrio.jwt.expiration-ms=86400000

# ===================================================================
# PLANTILLAS THYMELEAF (Semana 01 - Vistas de Referencia)
# ===================================================================
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
