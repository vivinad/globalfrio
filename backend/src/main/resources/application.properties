# ===================================================================
# CONFIGURACIÓN GENERAL DEL SERVIDOR WEB
# ===================================================================
server.port=8080
spring.application.name=globalfrio-backend
spring.profiles.active=dev

# ===================================================================
# CONFIGURACIÓN BASE DE DATOS H2 EN MEMORIA (Desarrollo Local - Activo)
# ===================================================================
spring.datasource.url=jdbc:h2:mem:globalfriodb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Consola Interactiva H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===================================================================
# CONFIGURACIÓN SWAGGER / OPENAPI 3
# ===================================================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui/index.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# ===================================================================
# PARÁMETROS DE SEGURIDAD Y JWT (S05 - SIST1402A)
# ===================================================================
# Clave HMAC-SHA256 de al menos 256 bits (64 caracteres hexadecimales)
globalfrio.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
# Expiración del token: 86400000 ms (24 horas)
globalfrio.jwt.expiration-ms=86400000

# ===================================================================
# PLANTILLAS THYMELEAF (Semana 01 - Vistas de Referencia)
# ===================================================================
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

