<header class="gf-header">
  <div class="gf-header__inner">
    <a class="gf-brand" href="#inicio">
      <img src="assets/logo.png" alt="Global Frío" width="44" height="44">
      <span class="gf-brand__text">
        <span class="gf-brand__name">GLOBAL FRÍO</span>
        <span class="gf-brand__tag">Aire acondicionado</span>
      </span>
    </a>

    <nav class="gf-nav" aria-label="Secciones principales">
      <a href="#servicios">Servicios</a>
      <a href="#trabajos">Trabajos</a>
      <a href="#mantenimiento">Mantenimiento</a>
      <a href="#ubicacion">Ubicación</a>
    </nav>

    <div class="gf-header__actions">
      <!-- Botón de cambio de ambiente claro / oscuro -->
      <button
        type="button"
        class="btn btn-ghost btn-ambiente"
        (click)="alternarTema()"
        [title]="'Cambiar a modo ' + (temaActual === 'oscuro' ? 'claro' : 'oscuro')"
        [attr.aria-label]="'Cambiar a modo ' + (temaActual === 'oscuro' ? 'claro' : 'oscuro')">
        <span *ngIf="temaActual === 'oscuro'">☀️ Claro</span>
        <span *ngIf="temaActual === 'claro'">🌙 Oscuro</span>
      </button>

      <a
        class="btn btn-primary btn-marca blueprint gf-header__cta"
        [href]="whatsappEnlace"
        target="_blank"
        rel="noopener noreferrer">
        <i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
        <span>{{ whatsappEtiqueta }}</span>
      </a>
    </div>
  </div>
</header>
