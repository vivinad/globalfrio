<section class="gf-banda" id="mantenimiento">
  <div class="gf-wrap gf-split">
    <div>
      <p class="gf-kicker">03 — Mantenimiento</p>
      <h2 class="gf-title">Realízalo cada 6 meses</h2>
      <p class="gf-banda__text">
        El mantenimiento periódico alarga la vida útil del equipo, baja el consumo eléctrico
        y evita reparaciones costosas. Programamos la visita y te avisamos cuando toca la siguiente.
      </p>
      <button
        class="btn blueprint"
        type="button"
        (click)="abrirModal()">
        <i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
        Programar mantenimiento
      </button>
    </div>

    <div class="gf-checklist" *ngIf="items$ | async as items">
      <div *ngFor="let item of items">
        <h4>{{ item.titulo }}</h4>
        <p>{{ item.texto }}</p>
      </div>
    </div>
  </div>
</section>
