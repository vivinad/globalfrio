<body>

<!-- Cada [data-gf-incluir] se reemplaza en tiempo de carga por el .html del
     componente indicado (ver js/nucleo/incluir.service.js). Requiere servir
     el sitio por http/https: no funciona abriendo este archivo con doble
     clic (file://). Para probarlo en tu máquina, un servidor local basta,
     por ejemplo: npx serve, o python -m http.server. -->

<div data-gf-incluir="Modulo-cabecera/Components/header/header.component"></div>

<main>
  <div data-gf-incluir="Modulo-hero/Components/hero/hero.component"></div>
  <div data-gf-incluir="Modulo-servicios/Components/servicios/servicios.component"></div>
  <div data-gf-incluir="Modulo-trabajos/Components/trabajos/trabajos.component"></div>

</main>

<div data-gf-incluir="Modulo-pie/Components/footer/footer.component"></div>

<div data-gf-incluir="Modulo-contacto/Components/modal/modal.component"></div>

<!-- Orden de carga: namespace → nucleo → Models de cada módulo → Services de
     cada módulo → Components de cada módulo → app. Dentro de cada capa el
     orden entre módulos no importa; entre capas, sí (un Service puede usar
     un Model, un Component puede usar un Service). -->
<script src="js/namespace.js"></script>
<script src="js/nucleo/incluir.service.js"></script>

<script src="js/Modulo-mantenimiento/Services/mantenimiento.service.js"></script>
